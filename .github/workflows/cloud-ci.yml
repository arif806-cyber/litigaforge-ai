name: Cloud deployment checks
on:
  pull_request:
  push:
    branches: [main, feature/arifbase]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: artifacts/litigaforge-ai/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm -r --filter "./artifacts/**" --if-present run typecheck
      - run: pip install -r artifacts/litigaforge-ai/requirements.txt
      - run: pip install pytest
      - run: pytest -q tests
        working-directory: artifacts/litigaforge-ai
        env:
          PYTHONPATH: .
          SESSION_SECRET: ci-placeholder-only
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
  images:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/arifbase')
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: ai
            dockerfile: deployable/docker/backend.Dockerfile
          - image: api-server
            dockerfile: deployable/docker/api-server.Dockerfile
          - image: ui
            dockerfile: deployable/docker/ui.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
