name: LitigaForge app checks
on:
  pull_request:
  push:
    branches: [main, feature/arifbase]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: artifacts/litigaforge-ai/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm -r --filter "./artifacts/**" --if-present run typecheck
      - run: pip install -r artifacts/litigaforge-ai/requirements.txt
      - run: pip install pytest
      - run: pytest -q tests
        working-directory: artifacts/litigaforge-ai
        env:
          PYTHONPATH: .
          SESSION_SECRET: ci-placeholder-only
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
