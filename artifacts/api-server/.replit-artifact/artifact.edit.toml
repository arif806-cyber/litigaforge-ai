kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 5000
name = "LitigaForge AI"
paths = ["/litigaforge"]

[services.development]
run = "cd artifacts/litigaforge-ai && BASE_PATH=/litigaforge PORT=5000 python main.py"

[services.production]

[services.production.run]
args = ["python", "artifacts/litigaforge-ai/main.py"]

[services.production.run.env]
PORT = "5000"
BASE_PATH = "/litigaforge"

[services.production.health.startup]
path = "/litigaforge/healthz"
