    <!-- Google Analytics (GA4) — loaded completely off the critical path so it
         never blocks the main thread (the PageSpeed TBT culprit). The gtag()
         stub queues events immediately into dataLayer; the heavy script is
         fetched only AFTER the page is interactive: load + 3s, then during a
         browser idle slot. NOTE: this GA4 measurement id (G-…) must be loaded
         via gtag/js, NOT gtm.js (gtm.js is for GTM container ids, GTM-…). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view:false — page_views are sent manually from the SPA
      // (src/lib/analytics.ts) on every route change so client-side
      // navigations are tracked, not just the first load.
      gtag('config', 'G-DHTR1SECG4', { send_page_view: false });
      window.addEventListener('load', function () {
        var loadGA = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-DHTR1SECG4';
          document.head.appendChild(s);
        };
        setTimeout(function () {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGA, { timeout: 2000 });
          } else {
            loadGA();
          }
        }, 3000); // load 3s after the page is interactive
      });
    </script>
