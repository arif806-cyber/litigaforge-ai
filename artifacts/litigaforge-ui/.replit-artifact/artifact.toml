kind = "web"
previewPath = "/"
title = "LitigaForge AI"
version = "1.0.0"
id = "artifacts/litigaforge-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23790

[services.development]
run = "BASE_PATH=/ pnpm --filter @workspace/litigaforge-ui run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/litigaforge-ui", "run", "build" ]

[services.production.build.env]
PORT = "23790"
BASE_PATH = "/"
NODE_ENV = "production"

[services.env]
PORT = "23790"
BASE_PATH = "/"