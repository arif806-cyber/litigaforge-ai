kind = "api"
previewPath = "/litigaforge"
title = "LitigaForge AI"
version = "1.0.0"

[[services]]
localPort = 8000
name = "LitigaForge AI"
paths = ["/litigaforge"]

[services.development]
run = "cd artifacts/litigaforge-ai && PORT=8000 python main.py"

[services.production]

[services.production.build]
args = ["echo", "no-build-step"]

[services.production.run]
args = ["python", "artifacts/litigaforge-ai/main.py"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/litigaforge/health"
