kind = "video"
previewPath = "/litigaforge-demo/"
title = "LitigaForge AI — Product Demo"
version = "1.0.0"
id = "artifacts/litigaforge-demo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/litigaforge-demo/" ]
localPort = 24347

[services.development]
run = "pnpm --filter @workspace/litigaforge-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/litigaforge-demo", "run", "build" ]
publicDir = "artifacts/litigaforge-demo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24347"
BASE_PATH = "/litigaforge-demo/"
