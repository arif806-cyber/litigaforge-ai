version: "3.9"

services:
  backend:
    build:
      context: ./web/backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      BASE_PATH: "/litigaforge"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_SETU_KEY: ${API_SETU_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/litigaforge/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./web/frontend
      args:
        BASE_PATH: "/"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
